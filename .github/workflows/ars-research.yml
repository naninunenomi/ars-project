name: ARS Researcher (v14.0)

concurrency:
  group: ars-research-group
  cancel-in-progress: false

on:
  repository_dispatch:
    types: [ars-research-command]
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # 毎日 日本時間 朝8時
    - cron: '0 11 * * *' # 毎日 日本時間 夜20時

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Run ARS Deep Research
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ARS_GAP: ${{ github.event.client_payload.gap }}
          ARS_TOPIC: ${{ github.event.client_payload.topic }}
        run: |
          node scripts/researcher.js
