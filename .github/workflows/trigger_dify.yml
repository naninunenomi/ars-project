name: Trigger Dify Workflow (Auto-Blogger)

on:
  schedule:
    # 毎日 日本時間 朝8:00, 8:30, 9:00 および 夕方18:00, 18:30, 19:00 に起動
    # (UTC 23:00, 23:30, 00:00) / (UTC 09:00, 09:30, 10:00)
    - cron: '0,30 23,0 * * *'
    - cron: '0,30 9,10 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  run-dify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install rss-parser axios

      - name: Fetch latest news via RSS
        run: node scripts/fetch_news.js

      - name: Smart Trigger Dify (Zero Wait Retry)
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_API_URL: "https://api.dify.ai/v1/workflows/run"
        run: node scripts/trigger.js

      - name: Commit state.json if modified
        run: |
          git config --global user.name "github-actions-bot"
          git config --global user.email "bot@github.com"
          git add blog/state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state.json" && git push)
