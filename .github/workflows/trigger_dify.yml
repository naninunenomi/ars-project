name: Trigger Dify Workflow (Auto-Blogger)

on:
  schedule:
    # 毎日 日本時間 朝8時（UTC 23:00）と 夕方18時（UTC 09:00）に起動
    - cron: '0 23,9 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  run-dify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse sources and trigger Dify API
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_API_URL: "https://api.dify.ai/v1/workflows/run" # 自社ホスト版の場合はここを変更
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # ランダムに1件選ぶ (BashのRANDOM変数を使用してjqに渡す)
            RANDOM_INDEX=$((RANDOM))
            TARGET=$(jq --arg idx "$RANDOM_INDEX" '.[($idx | tonumber) % length]' blog/sources.json)
            
            SOURCE_URL=$(echo "$TARGET" | jq -r '.url')
            SOURCE_NAME=$(echo "$TARGET" | jq -r '.name')
            SOURCE_ABOUT=$(echo "$TARGET" | jq -r '.category')

            echo "🚀 [Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES] Triggering Dify for: $SOURCE_NAME ($SOURCE_URL)"

            # DifyのWebhook（Workflow API）をキックし、レスポンスを変数に格納
            RESPONSE=$(curl -s -X POST "$DIFY_API_URL" \
              -H "Authorization: Bearer $DIFY_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "inputs": {
                  "url": "'"$SOURCE_URL"'",
                  "source_name": "'"$SOURCE_NAME"'",
                  "source_about": "'"$SOURCE_ABOUT"'"
                },
                "response_mode": "blocking",
                "user": "github-actions-bot"
              }')
            
            echo "📥 Response from Dify received."
            
            # レスポンス内に "STUDYING" か "DANGER" という文字が含まれているかチェック
            if echo "$RESPONSE" | grep -q "STUDYING"; then
              echo "⚠️ ARS is currently STUDYING this topic. Skipping to next news..."
            elif echo "$RESPONSE" | grep -q "DANGER"; then
              echo "❌ ARS judged this topic as DANGER. Skipping to next news..."
            else
              echo "✅ Dify workflow completed successfully (SAFE). Article published!"
              SUCCESS=1
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 5
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "🚨 All $MAX_RETRIES attempts resulted in STUDYING or DANGER. Exiting."
            exit 0 # 意図的なスキップなのでエラー(exit 1)にはせず正常終了とする
          fi
