name: Trigger Dify Workflow (Auto-Blogger)

on:
  schedule:
    # 30分おきに24時間実行（1日48回）
    # pendingなし・2記事達成済みの場合は数秒で即終了するため無料枠に影響なし
    - cron: '0,30 * * * *'
  workflow_dispatch: # 手動実行用

permissions:
  contents: write

jobs:
  run-dify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install rss-parser axios

      - name: Fetch latest news via RSS
        run: node scripts/fetch_news.js

      - name: Smart Trigger Dify (Zero Wait Retry)
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_API_URL: "https://api.dify.ai/v1/workflows/run"
        run: node scripts/trigger.js

      - name: Commit state.json if modified
        run: |
          git config --global user.name "github-actions-bot"
          git config --global user.email "bot@github.com"
          git add blog/state.json blog/sources.json blog/articles/ web/src/data/articles/ || true
          git diff --staged --quiet || (git commit -m "Update state, sources, and articles" && git push)

      - name: Auto-post to X (Twitter)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/tweet.js
