name: Deep-Dive 記事生成（手動）

# スマホのGitHubアプリ or Webの「Run workflow」から、今日の下書きを貼り付けて実行できます。
on:
  workflow_dispatch:
    inputs:
      draft:
        description: '今日のニュース下書き（本文をまるごと貼り付け）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate deep-dive article（調べる→書く→ARSチェック）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DAILY_DRAFT: ${{ github.event.inputs.draft }}
        run: node scripts/generate_deepdive.js

      - name: Commit & push（サイトに公開）
        run: |
          git config user.name "github-actions-bot"
          git config user.email "bot@github.com"
          git add web/src/data/articles/ || true
          git diff --staged --quiet || (git commit -m "Auto: add deep-dive article" && git pull --rebase --autostash origin main && git push)
