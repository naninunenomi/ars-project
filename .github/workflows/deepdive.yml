name: Deep-Dive 記事生成（自動＋手動）

# 自動: 毎日 日本時間 朝7時に、Googleドキュメントの下書きを読んで記事化・公開。
# 手動: 「Run workflow」で下書きを貼れば、その場でテスト実行できます。
on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 日本時間 朝7:00（毎日）
  workflow_dispatch:
    inputs:
      draft:
        description: '（手動テスト用）下書きを貼り付け。空欄ならGoogleドキュメントを読みます'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate deep-dive article（調べる→書く→ARSチェック）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DAILY_DRAFT: ${{ github.event.inputs.draft }}
          DRAFT_DOC_URL: 'https://docs.google.com/document/d/1FXHp64Z3XMcIc-igmdfX436rHJ86TwU3gI4vxB_R58A/export?format=txt'
        run: node scripts/generate_deepdive.js

      - name: Commit & push（サイトに公開）
        run: |
          git config user.name "github-actions-bot"
          git config user.email "bot@github.com"
          git add web/src/data/articles/ blog/deepdive_state.json || true
          git diff --staged --quiet || (git commit -m "Auto: deep-dive article" && git pull --rebase --autostash origin main && git push)
