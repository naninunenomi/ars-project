<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAHOOニュース | Automation News</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({startOnLoad:true});</script>
    <style>
        :root {
            --text-main: #333333;
            --text-light: #666666;
            --bg-body: #f9f9f9;
            --bg-content: #ffffff;
            --accent-color: #2563eb;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.8;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background-color: var(--bg-content);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            text-align: center;
        }

        .header-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .main-container {
            max-width: 760px;
            margin: 40px auto;
            background-color: var(--bg-content);
            padding: 50px 60px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .article-header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.4;
            margin: 0 0 20px 0;
            color: #111827;
        }

        .citation-box {
            background-color: #f8fafc;
            border-left: 4px solid #64748b;
            padding: 20px;
            margin-bottom: 40px;
            font-size: 0.95rem;
            color: #334155;
        }
        .citation-box a {
            color: var(--accent-color);
            word-break: break-all;
        }

        .tldr-box {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 40px;
        }

        .tldr-box h3 {
            margin: 0 0 15px 0;
            color: #166534;
            font-size: 1.1rem;
        }

        .tldr-list {
            margin: 0;
            padding-left: 20px;
            color: #15803d;
        }

        h2 {
            font-size: 1.6rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 50px;
            margin-bottom: 25px;
            color: #111827;
        }

        p {
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        .ad-section {
            margin-top: 50px;
            padding: 30px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            text-align: center;
        }

        .ad-label {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 15px;
            display: block;
        }

        .full-translation-section {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 2px dashed var(--border-color);
            color: #475569;
        }
        
        .full-translation-section h2 {
            color: #64748b;
            font-size: 1.3rem;
            border-bottom: none;
        }

        .footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="header-logo">Automation News</a>
    </header>

    <main class="main-container">
        <article>
            <div class="article-header">
                <h1>YAHOOニュース</h1>
            </div>

            <div class="citation-box">
                <strong>📝 引用元ソース:</strong> YAHOOニュース<br>
                <strong>📌 記事概要:</strong> ITカテゴリ<br>
                <strong>🔗 URL:</strong> <a href="https://news.yahoo.co.jp/expert/articles/b50350fddadff55f628819257a371e567f531e7b" target="_blank" rel="noopener">https://news.yahoo.co.jp/expert/articles/b50350fddadff55f628819257a371e567f531e7b</a>
            </div>

                <a href='https://example.com/school'>未経験からAIエンジニアへ</a>

            <div class="ad-section">
                <span class="ad-label">この記事を読んで自動化を始めたくなった方へ</span>
                <div class="ad-content">
                    <a href='https://example.com/school'>未経験からAIエンジニアへ</a>

            </div>
        </article>
    </main>

    <footer class="footer">
        &copy; 2026 Automation News. All rights reserved.
    </footer>
</body>
</html>
