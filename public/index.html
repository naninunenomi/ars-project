<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARS Portal - Director's Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #00bdff;
            --bg: #0a0e14;
            --card-bg: #161c24;
            --text: #ffffff;
            --accent: #ff007a;
        }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .full-width { grid-column: span 2; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { font-weight: 800; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 1rem; color: #888; text-transform: uppercase; letter-spacing: 2px; }
        .big-number { font-size: 3.5rem; font-weight: 800; color: var(--primary); }
        .unit { font-size: 1.2rem; }
        .log { background: #000; padding: 15px; font-family: monospace; font-size: 0.8rem; color: #00ff88; height: 120px; overflow-y: auto; border-radius: 12px; }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--primary); }
        .dot { width: 10px; height: 10px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; background: var(--secondary); color: var(--bg); font-weight: bold; margin-bottom: 5px; }
        select { background: #000; color: white; border: 1px solid var(--primary); padding: 5px; border-radius: 8px; font-family: 'Outfit'; }
        
        .knowledge-panel { background: rgba(0,255,136,0.05); border: 1px solid var(--primary); padding: 15px; border-radius: 16px; margin-top: 20px; }
        .rule-btn { background: #000; color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; margin-right: 10px; margin-bottom: 10px; transition: all 0.2s; }
        .rule-btn:hover { border-color: var(--secondary); color: var(--secondary); }
        .learn-btn { background: var(--secondary); color: var(--bg); border: none; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .rule-detail { display: none; background: #000; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 0.85rem; border-left: 3px solid var(--primary); }
    </style>
</head>
<body>

<div class="grid">
    <div class="card full-width">
        <h1>ARS INTEGRATED PORTAL</h1>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="status-badge"><span class="dot"></span> 24/7 AUTONOMOUS MONITORING ACTIVE</div>
            <div>
                <select id="scout-volume">
                    <option value="1">Standard (1 ad)</option>
                    <option value="100">Enterprise (100 ads)</option>
                    <option value="1000" selected>Infrastructure (1000 ads)</option>
                </select>
                <button onclick="toggleAutoPilot()" id="autopilot-btn" style="background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 10px 15px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-right: 10px; transition: all 0.3s ease;">
                    AUTO PILOT (OFF)
                </button>
                <button onclick="triggerScout()" id="scout-btn" style="background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; box-shadow: 0 0 15px var(--accent);">
                    ACTIVATE SCOUT (手動)
                </button>
            </div>
        </div>
        
        <div class="knowledge-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin:0; font-size: 1rem; color: var(--primary);">ACTIVE KNOWLEDGE BASE (学習済み法規)</h3>
                <button class="learn-btn" onclick="learnNewLaw()">+ 新しい法規を学習 (Gemini AI)</button>
            </div>
            <div id="knowledge-tags">
                <span style="color: #888; font-size: 0.8rem;">Loading knowledge base...</span>
            </div>
            <div id="knowledge-detail" class="rule-detail"></div>
        </div>
    </div>

    <div class="card">
        <h2>Live Revenue</h2>
        <div class="big-number" id="revenue">0<span class="unit">円</span></div>
        <p style="color: #888;">Cumulative Earnings (Real-time)</p>
        <p style="font-size: 0.7rem; color: var(--primary); margin-top: 10px;" id="last-update">Syncing...</p>
    </div>

    <div class="card">
        <h2>Daily Performance (日次集計)</h2>
        <div style="max-height: 120px; overflow-y: auto;">
            <table style="width: 100%; font-size: 0.8rem; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); color: #888; text-align: left;">
                        <th style="padding: 5px;">Date</th>
                        <th style="padding: 5px;">Trx</th>
                        <th style="padding: 5px;">Revenue</th>
                    </tr>
                </thead>
                <tbody id="daily-body"></tbody>
            </table>
        </div>
    </div>

    <div class="card full-width">
        <h2>Recent Transaction Logs</h2>
        <div class="log" id="log">Waiting for first sync...</div>
    </div>
</div>

<script>
    const TARGET_SAMPLES = [
        { text: "世界初のリバース成分配合！これだけで10歳若返ります。", priceInfo: { current: 15000, original: 30000, durationInWeeks: 1 } },
        { text: "業界最高品質の住宅。期間限定の特別価格でご提供！", priceInfo: { current: 48000000, original: 55000000, durationInWeeks: 2 } }
    ];

    async function triggerScout() {
        const btn = document.getElementById('scout-btn');
        const count = document.getElementById('scout-volume').value;
        const originalText = btn.innerText;
        btn.disabled = true;
        btn.innerText = `PROCESS ${count} ADS...`;
        
        try {
            const target = TARGET_SAMPLES[Math.floor(Math.random() * TARGET_SAMPLES.length)];
            const res = await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...target, count: parseInt(count) })
            });
            const data = await res.json();
            await fetchStats();
            alert(`監査成功: ${count} 件の広告を一括処理しました。\n報酬 ${data.billing.amount}円 を獲得。`);
        } catch (e) {
            alert("通信エラーが発生しました。");
        } finally {
            btn.disabled = false;
            btn.innerText = originalText;
        }
    }

    let autoPilotInterval = null;
    function toggleAutoPilot() {
        const btn = document.getElementById('autopilot-btn');
        if (autoPilotInterval) {
            clearInterval(autoPilotInterval);
            autoPilotInterval = null;
            btn.innerText = "AUTO PILOT (OFF)";
            btn.style.background = "transparent";
            btn.style.color = "var(--primary)";
            btn.style.boxShadow = "none";
        } else {
            autoPilotInterval = setInterval(triggerScoutSilent, 1000);
            btn.innerText = "AUTO PILOT (ON)";
            btn.style.background = "var(--primary)";
            btn.style.color = "var(--bg)";
            btn.style.boxShadow = "0 0 15px var(--primary)";
        }
    }

    async function triggerScoutSilent() {
        const count = document.getElementById('scout-volume').value;
        try {
            const target = TARGET_SAMPLES[Math.floor(Math.random() * TARGET_SAMPLES.length)];
            await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...target, count: parseInt(count), mode: "auto-pilot" })
            });
            await fetchStats();
        } catch (e) {
            console.error("AutoPilot Error:", e);
        }
    }

    async function fetchStats() {
        try {
            const res = await fetch(`/api/stats?t=${Date.now()}`);
            const data = await res.json();
            
            if (data.transactions !== "Data Offline") {
                document.getElementById('revenue').innerHTML = data.revenue + '<span class="unit">円</span>';
                
                const now = new Date();
                const dateStr = (now.getMonth() + 1) + '/' + now.getDate() + ' ' + now.toLocaleTimeString();
                document.getElementById('last-update').innerText = `Last Updated: ${dateStr}`;

                const dailyBody = document.getElementById('daily-body');
                if (data.dailyStats) {
                    dailyBody.innerHTML = '';
                    data.dailyStats.forEach(day => {
                        const tr = document.createElement('tr');
                        tr.style.borderBottom = "1px solid rgba(255,255,255,0.05)";
                        tr.innerHTML = `<td>${day.date}</td><td>${day.transactions}</td><td>${day.revenue}円</td>`;
                        dailyBody.appendChild(tr);
                    });
                }

                const log = document.getElementById('log');
                if (data.recentLogs) {
                    log.innerHTML = '';
                    data.recentLogs.forEach(entry => {
                        const div = document.createElement('div');
                        const date = new Date(entry.timestamp);
                        const ts = (date.getMonth() + 1) + '/' + date.getDate() + ' ' + date.toLocaleTimeString();
                        div.innerText = `[TRX]: ${entry.amount} JPY (${entry.count || 1} units) - ${entry.mode} - ${ts}`;
                        log.appendChild(div);
                    });
                }
            }
        } catch (e) {
            document.getElementById('last-update').innerText = "Sync Error - Retrying...";
        }
    }

    async function fetchKnowledge() {
        try {
            const res = await fetch('/api/knowledge');
            const data = await res.json();
            const container = document.getElementById('knowledge-tags');
            if (data.knowledge && data.knowledge.length > 0) {
                container.innerHTML = '';
                data.knowledge.forEach(rule => {
                    const btn = document.createElement('button');
                    btn.className = 'rule-btn';
                    btn.innerText = rule.lawName;
                    btn.onclick = () => showKnowledgeDetail(rule);
                    container.appendChild(btn);
                });
            } else {
                container.innerHTML = '<span style="color: #888; font-size: 0.8rem;">未学習（基本ルールで稼働中）</span>';
            }
        } catch (e) {
            console.error("Knowledge load error:", e);
        }
    }

    function showKnowledgeDetail(rule) {
        const detail = document.getElementById('knowledge-detail');
        detail.style.display = 'block';
        detail.innerHTML = `
            <strong style="color: var(--secondary);">${rule.lawName}</strong><br><br>
            <span style="color:#aaa">概要:</span> ${rule.summary}<br><br>
            <span style="color:#aaa">検知NGワード:</span> <span style="color:#ff007a">${rule.ngKeywords.join(', ')}</span>
        `;
    }

    async function learnNewLaw() {
        const lawText = prompt("学習させたい法律の概要テキストを入力してください（Geminiが自動で解析・ルール化します）:\n\n例: 「金融商品取引法。元本保証や絶対儲かるといった表現を禁止する。」");
        if (!lawText) return;

        const btn = document.querySelector('.learn-btn');
        btn.innerText = "Gemini AI 学習中...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/learn', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: lawText })
            });
            const data = await res.json();
            
            if (data.success) {
                alert(`学習完了: ${data.learnedData.lawName}\n\nデータベースに新しい法規とNGキーワードが追加されました！`);
                await fetchKnowledge(); // UIを即座に更新
            } else {
                alert(`エラー: ${data.error}`);
            }
        } catch (e) {
            alert("通信エラーが発生しました。");
        } finally {
            btn.innerText = "+ 新しい法規を学習 (Gemini AI)";
            btn.disabled = false;
        }
    }

    setInterval(fetchStats, 5000);
    fetchStats();
    fetchKnowledge();
</script>
</body>
</html>
