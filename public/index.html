<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARS Director's Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --bg: #0a0e14;
            --card-bg: #161c24;
            --text: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        .header {
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00ff88, #00bdff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        .label { font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 2px; }
        .value { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin-top: 0.5rem; }
        .unit { font-size: 1rem; color: var(--primary); margin-left: 0.5rem; }
        
        .realtime-log {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            color: #00ff88;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ARS REVENUE MONITOR</h1>
            <p>Autonomous Legal Audit Economy</p>
        </div>

        <div class="stats-grid">
            <div class="card pulse">
                <div class="label">Total Transactions</div>
                <div id="trans-count" class="value">0</div>
            </div>
            <div class="card">
                <div class="label">Estimated Revenue (JPY)</div>
                <div id="revenue" class="value">0<span class="unit">円</span></div>
            </div>
        </div>

        <div class="realtime-log" id="log">
            [SYS]: Monitoring ARS Box...<br>
            [SYS]: Connection OK (ars-project.vercel.app)<br>
        </div>
    </div>

    <script>
        // デモンストレーション用の簡易シミュレーション
        // 実際にはAPIから統計データを取得するように拡張します
        let count = 0;
        let revenue = 0;

        function update() {
            // ランダムに取引が発生するシミュレーション
            if (Math.random() > 0.7) {
                count++;
                const amount = Math.random() > 0.8 ? 100 : 1; // 100円（薬機法）or 1円
                revenue += amount;
                
                document.getElementById('trans-count').innerText = count;
                document.getElementById('revenue').innerHTML = revenue + '<span class="unit">円</span>';
                
                const log = document.getElementById('log');
                const entry = document.createElement('div');
                entry.innerText = `[TRX]: ${amount} JPY Audit Complete - ${new Date().toLocaleTimeString()}`;
                log.prepend(entry);
            }
        }

        setInterval(update, 3000);
    </script>
</body>
</html>
